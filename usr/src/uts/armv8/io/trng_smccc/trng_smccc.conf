#
# nostats: set to 1 to suppress kstat creation (covert-channel
# mitigation).  Default: kstats enabled.
#
# trng-busywait-attempts: total number of busy-wait SMCCC calls
# per chunk when firmware returns NO_ENTROPY.  0 selects the
# default.  Default: 5.
#
# trng-retry-delay-us: microsecond delay between busy-wait
# attempts.  0 selects the default.  Default: 100.
#
# trng-sleep-attempts: total number of tick-sleep SMCCC calls per
# chunk after busy-wait attempts are exhausted.  0 selects the
# default.  Default: 10.
#
# nostats=1;
# trng-busywait-attempts=5;
# trng-retry-delay-us=100;
# trng-sleep-attempts=10;
#
ddi-forceattach=1 ddi-no-autodetach=1;
